name: Dependabot auto-merge

# Merges a Dependabot pull request once build-and-release.yml succeeded on its head commit. A workflow_run instead of
# native auto-merge with required status checks: a required check in the main ruleset would also block the open
# source compliance commit the main build pushes directly with the GITHUB_TOKEN. This file always runs from main, so a
# pull request cannot change what it checks.
on:
  workflow_run:
    workflows: [ "Build and release CLI" ]
    types: [ completed ]

concurrency:
  group: dependabot-merge-${{ github.event.workflow_run.head_branch }}

# Writes go through the GitHub App token: a merge with the GITHUB_TOKEN would not trigger the release build on main.
permissions: { }

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      # A taken version needs no check here: the build fails on a Dependabot branch whose version is already tagged.
      # --match-head-commit refuses the merge if the pull request moved on since the build. Rebase is the only merge
      # method the repository allows.
      - name: Merge if the head is the version bump
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          NUMBER="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${HEAD_BRANCH}" --base "${DEFAULT_BRANCH}" \
            --author 'app/dependabot' --state open --json number --jq '.[0].number // empty')"
          if [ -z "${NUMBER}" ]; then
            echo "No open Dependabot pull request for ${HEAD_BRANCH}."
            exit 0
          fi
          # The build of Dependabot's own commit is green too, but that commit carries no version bump
          SUBJECT="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}" --jq '.commit.message | split("\n")[0]')"
          if [[ "${SUBJECT}" != "Bump version to "* ]]; then
            echo "Not merging #${NUMBER}: ${HEAD_SHA} is not a version bump (${SUBJECT})."
            exit 0
          fi
          gh pr merge "${NUMBER}" --repo "${GITHUB_REPOSITORY}" --rebase --match-head-commit "${HEAD_SHA}"
