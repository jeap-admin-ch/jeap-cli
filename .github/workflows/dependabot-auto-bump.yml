name: Dependabot auto version bump

on:
  # pull_request_target instead of pull_request: Dependabot-triggered pull_request runs only receive Dependabot
  # secrets, so BOT_APP_ID/BOT_APP_PRIVATE_KEY would be empty. pull_request_target runs in the base-repo context with
  # Actions secrets; the job below is gated to Dependabot pull requests from this repository.
  # synchronize/reopened: Dependabot force-pushes onto an open pull request when it adds newer versions or rebases it,
  # which drops the version bump commit, so the bump has to be made again.
  pull_request_target:
    types: [ opened, synchronize, reopened ]

concurrency:
  group: dependabot-bump-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Writes go through the GitHub App token: a push with the GITHUB_TOKEN would not trigger build-and-release.yml.
permissions:
  contents: read
  pull-requests: read

jobs:
  bump:
    # The commit step pushes with the GitHub App token, so the resulting synchronize event is attributed to the app's
    # bot actor, not dependabot[bot]; this condition already keeps that push from retriggering this workflow.
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      # Maven runs plugins from the updated POMs, so the token is not stored in the git config; only the push gets it.
      # fetch-depth 0: the release tags decide which versions are taken.
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Local actions are loaded from the workspace, so they are taken from the base branch, not from the pull request
      - name: Checkout actions of the base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: .base
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # A dependency update carries no API change, so patch is the honest semver step
      - name: Bump patch version
        id: bump
        uses: ./.base/.github/actions/maven-patch-bump
        with:
          base-ref: ${{ github.event.pull_request.base.ref }}

      - name: Add CHANGELOG entry
        if: steps.bump.outputs.bumped == 'true'
        uses: ./.base/.github/actions/dependabot-changelog
        with:
          version: ${{ steps.bump.outputs.version }}
          pull-request: ${{ github.event.pull_request.number }}
          base-ref: ${{ github.event.pull_request.base.ref }}

      # The same action as in build-and-release.yml: updates publiccode.yml and THIRD-PARTY-LICENSES.md, so the license
      # changes are part of the reviewed pull request instead of a commit on main after the merge
      - name: Open Source Compliance
        if: steps.bump.outputs.bumped == 'true'
        uses: ./.base/.github/actions/opensource-compliance
        with:
          project-version: ${{ steps.bump.outputs.version }}
          additional-licenses-file: jeap-cli/src/main/docs-preview/THIRD-PARTY-LICENSES.md

      # [dependabot skip] lets Dependabot keep rebasing the pull request and force-push over this commit. Without it,
      # Dependabot stops updating a pull request once someone else pushed to it, and a pull request in conflict with
      # main (another version bump merged in the meantime) would stay stuck instead of being bumped again.
      # No rebase on a rejected push: it means Dependabot force-pushed meanwhile, and the run for that push bumps.
      - name: Commit and push
        if: steps.bump.outputs.bumped == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pom.xml jeap-cli/pom.xml publiccode.yml CHANGELOG.md THIRD-PARTY-LICENSES.md
          git commit -m "Bump version to ${VERSION} [dependabot skip]"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
