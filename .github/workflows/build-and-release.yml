name: Build and release CLI

on:
  push:
    branches: [ "main", "feature/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for tags & changelog

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven local repository
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Read Project Version
        id: pomversion
        run: |
          echo "version=$(./mvnw -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec)" >> $GITHUB_OUTPUT

      # Create a release version without -SNAPSHOT
      - name: Set Release Version
        id: version
        run: |
          set -euo pipefail
          pomversion="${{ steps.pomversion.outputs.version }}"
          REL="${pomversion%-SNAPSHOT}"
          echo "Set version to $REL"
          ./mvnw -q versions:set -DnewVersion="$REL" -DgenerateBackupPoms=false
          echo "version=$REL" >> $GITHUB_OUTPUT

      # Fail if a git tag for this version already exists
      - name: Ensure Version Tag does not Already Exist
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git fetch --tags --force
          TAG="${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Error: tag '${TAG}' already exists. Bump the project version before releasing."
            exit 1
          fi

      - name: Show Java Versions
        run: |
          java -version

      - name: ShellCheck
        run: shellcheck jeap install.sh

      - name: Pre-resolve Maven dependencies for Trivy
        run: ./mvnw -B -ntp dependency:resolve dependency:resolve-plugins

      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'repo'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln,secret,misconfig'
          trivy-config: '.trivyconfig.yaml'

      - name: Open Source Compliance
        uses: ./.github/actions/opensource-compliance
        with:
          project-version: ${{ steps.version.outputs.version }}
          commit-changes: ${{ github.ref == 'refs/heads/main' }}
          additional-licenses-file: jeap-cli/src/main/docs-preview/THIRD-PARTY-LICENSES.md

      - name: Maven Build
        run: ./mvnw -B -ntp -Pnative package

      # The binary must keep running on the Amazon Linux 2023 CodeBuild image (glibc 2.34) used by the docs preview workflow
      - name: Check glibc Requirement
        run: |
          set -euo pipefail
          REQUIRED="$(objdump -T jeap-cli/target/jeap-cli | grep -o 'GLIBC_[0-9.]*' | sort -u -V | tail -n 1)"
          echo "Highest glibc symbol version: ${REQUIRED}"
          if [ "$(printf '%s\n' "${REQUIRED#GLIBC_}" 2.34 | sort -V | tail -n 1)" != "2.34" ]; then
            echo "Error: the binary needs ${REQUIRED}, more than GLIBC_2.34 of Amazon Linux 2023."
            exit 1
          fi

      - name: Prepare Binary
        run: |
          set -euo pipefail
          mkdir -p dist
          cp jeap-cli/target/jeap-cli dist/jeap-cli-linux-x86_64
          cd dist
          shasum -a 256 jeap-cli-linux-x86_64 > jeap-cli-linux-x86_64.sha256
          cat jeap-cli-linux-x86_64.sha256

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: jeap-cli-linux-x86_64
          path: dist/
          if-no-files-found: error

      # Find previous tag (before a new one is created) for changelog
      - name: Determine Previous Tag
        if: github.ref == 'refs/heads/main'
        id: previoustag
        run: |
          set -euo pipefail
          git fetch --tags --force
          # Try semantic sort first, fall back to most recent by date
          PREV="$(git tag --sort=-version:refname | head -n 1 || true)"
          if [ -z "$PREV" ]; then
            PREV="$(git for-each-ref --sort=-creatordate --format '%(refname:short)' refs/tags | head -n 1 || true)"
          fi
          echo "prev_tag=$PREV" >> "$GITHUB_OUTPUT"

      # Create git tag for released version and push it. Tagging stays in this job so the tag points to the
      # commit created by the open source compliance step.
      - name: Create and Push Git Tag
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.version }}"
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      # Generate release notes with install hint, assets and changelog since previous tag
      - name: Generate Release Notes
        if: github.ref == 'refs/heads/main'
        env:
          VERSION: "${{ steps.version.outputs.version }}"
          PREV: "${{ steps.previoustag.outputs.prev_tag }}"
        run: |
          set -euo pipefail
          {
            echo "# Release ${VERSION}"
            echo
            echo "Install or update the launcher, which downloads the binary for your platform:"
            echo
            echo '```bash'
            echo 'curl -sSL https://raw.githubusercontent.com/jeap-admin-ch/jeap-cli/main/install.sh | bash'
            echo '```'
            echo
            echo "Assets:"
            echo
            echo "- \`jeap-cli-linux-x86_64\` (Linux x86_64, also for WSL)"
            echo "- \`jeap-cli-macos-aarch64\` (macOS arm64)"
            echo "- \`.sha256\` checksum file for each binary"
            echo
            if [ -n "$PREV" ]; then
              echo "## Changelog since \`${PREV}\`"
              echo
              git log --no-merges --pretty=format:'- %s (%h)' "${PREV}..HEAD" || true
            else
              echo "## Changelog"
              echo
              git log --no-merges --pretty=format:'- %s (%h)' || true
            fi
            echo
          } > RELEASE_NOTES.md

      - name: Upload Release Notes
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error

  macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven local repository
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Read Project Version
        id: pomversion
        run: |
          echo "version=$(./mvnw -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec)" >> $GITHUB_OUTPUT

      # Create a release version without -SNAPSHOT, so the binary reports the release version
      - name: Set Release Version
        run: |
          set -euo pipefail
          pomversion="${{ steps.pomversion.outputs.version }}"
          REL="${pomversion%-SNAPSHOT}"
          echo "Set version to $REL"
          ./mvnw -q versions:set -DnewVersion="$REL" -DgenerateBackupPoms=false

      - name: Maven Build
        run: ./mvnw -B -ntp -Pnative package

      - name: Prepare Binary
        run: |
          set -euo pipefail
          mkdir -p dist
          cp jeap-cli/target/jeap-cli dist/jeap-cli-macos-aarch64
          cd dist
          shasum -a 256 jeap-cli-macos-aarch64 > jeap-cli-macos-aarch64.sha256
          cat jeap-cli-macos-aarch64.sha256

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: jeap-cli-macos-aarch64
          path: dist/
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main'
    needs: [ linux, macos ]
    runs-on: ubuntu-latest

    steps:
      - name: Download Binaries and Release Notes
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Publish GitHub release for this version with notes and binaries
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.linux.outputs.version }}
          name: ${{ needs.linux.outputs.version }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/jeap-cli-linux-x86_64
            dist/jeap-cli-linux-x86_64.sha256
            dist/jeap-cli-macos-aarch64
            dist/jeap-cli-macos-aarch64.sha256
          fail_on_unmatched_files: true
          make_latest: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
