name: 'Dependabot CHANGELOG Entry'
description: 'Adds a CHANGELOG.md entry listing the updates of a Dependabot pull request'
author: 'jEAP'

inputs:
  version:
    description: 'Version of the new entry'
    required: true
  pull-request:
    description: 'Number of the Dependabot pull request'
    required: true
  base-ref:
    description: 'Branch the pull request is merged into, e.g. main; expects a checkout with its history'
    required: true
  github-token:
    description: 'Token that can read the pull request'
    required: false
    default: ${{ github.token }}
  changelog:
    description: 'Path of the CHANGELOG'
    required: false
    default: 'CHANGELOG.md'

runs:
  using: 'composite'
  steps:
    # The pull request body of a multi-ecosystem group describes one ecosystem only (Maven here), so the npm and GitHub
    # Actions updates are read from the diff: changed "name": "version" lines of package.json files and changed uses:
    # lines. The body gives the table of grouped pull requests (| [name](link) | `from` | `to` |, the link is optional)
    # or the sentence of a single update (Bumps [name](link) from a to b.).
    - name: Add CHANGELOG entry
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        VERSION: ${{ inputs.version }}
        PR_NUMBER: ${{ inputs.pull-request }}
        BASE_REF: ${{ inputs.base-ref }}
        CHANGELOG: ${{ inputs.changelog }}
      run: |
        set -euo pipefail
        gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""' > "${RUNNER_TEMP}/pr-body.md"
        # shellcheck disable=SC2016 # the backticks are Markdown, not command substitution
        FROM_BODY="$(sed -nE \
          -e 's/^\| *\[?([^]|[ ]+)\]?(\([^)]*\))? *\| *`([^`]+)` *\| *`([^`]+)` *\|.*$/- Updated `\1` from \3 to \4./p' \
          -e 's/^Bumps \[([^]]+)\]\([^)]*\) from ([^ ]+) to ([^ ]+)\.$/- Updated `\1` from \2 to \3./p' \
          "${RUNNER_TEMP}/pr-body.md")"
        # Lines "-|+ name version", paired by name
        # shellcheck disable=SC2016
        FROM_DIFF="$(git diff -U0 "origin/${BASE_REF}...HEAD" -- '*package.json' .github \
          | sed -nE \
            -e 's/^([-+])[[:space:]]*"([^"]+)": *"([^"]+)",?$/\1 \2 \3/p' \
            -e 's/^([-+])[[:space:]]*(- )?uses: *([^@ ]+)@([^ #]+).*$/\1 \3 \4/p' \
          | awk '$1 == "-" { old[$2] = $3 }
                 $1 == "+" { if (!($2 in new)) order[++n] = $2; new[$2] = $3 }
                 END { for (i = 1; i <= n; i++) { k = order[i]
                         if (k in old && old[k] != new[k]) printf "- Updated `%s` from %s to %s.\n", k, old[k], new[k] } }')"
        UPDATES="$(printf '%s\n%s\n' "${FROM_BODY}" "${FROM_DIFF}" | awk -F'`' 'NF > 1 && !seen[$2]++')"
        ENTRY="$(printf '## [%s] - %s\n\n### Changed\n\n%s\n' "${VERSION}" "$(date +%Y-%m-%d)" "${UPDATES:-- Updated dependencies.}")"
        echo "${ENTRY}"
        ENTRY="${ENTRY}" awk 'BEGIN { done = 0 } /^## \[/ && !done { print ENVIRON["ENTRY"] "\n"; done = 1 } { print }' \
          "${CHANGELOG}" > "${CHANGELOG}.new"
        mv "${CHANGELOG}.new" "${CHANGELOG}"
