name: 'Maven Patch Bump'
description: 'Bumps the Maven project to the next unreleased patch version (as x.y.z-SNAPSHOT), derived from the base branch and the release tags'
author: 'jEAP'

inputs:
  base-ref:
    description: 'Branch the pull request is merged into, e.g. main'
    required: true

outputs:
  bumped:
    description: 'Whether the version was changed (true/false)'
    value: ${{ steps.bump.outputs.bumped }}
  version:
    description: 'Release version of the bumped project, without -SNAPSHOT'
    value: ${{ steps.bump.outputs.version }}

runs:
  using: 'composite'
  steps:
    # Which version to release cannot be answered from the branch alone: a pull request merged in the meantime may
    # have released the version the branch would otherwise take. Expects a checkout with tags (fetch-depth: 0).
    - name: Bump to the next unreleased patch version
      id: bump
      shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref }}
      run: |
        set -euo pipefail
        pom_version() { yq -p xml -oy '.project.version' | sed 's/-SNAPSHOT$//'; }
        version_gt() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n 1)" = "$1" ]; }
        released() { git rev-parse -q --verify "refs/tags/$1" >/dev/null; }

        git fetch --tags --force origin "${BASE_REF}"
        BASE_VERSION="$(git show "origin/${BASE_REF}:pom.xml" | pom_version)"
        CURRENT_VERSION="$(pom_version < pom.xml)"
        echo "base=${BASE_VERSION} current=${CURRENT_VERSION}"

        # A bump that is already ahead of the base and unreleased is kept: re-running must not keep raising the version
        if version_gt "${CURRENT_VERSION}" "${BASE_VERSION}" && ! released "${CURRENT_VERSION}"; then
          echo "Version ${CURRENT_VERSION} is already ahead of ${BASE_REF} and unreleased, nothing to do."
          echo "bumped=false" >> "$GITHUB_OUTPUT"
          echo "version=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        FROM="${BASE_VERSION}"
        if version_gt "${CURRENT_VERSION}" "${BASE_VERSION}"; then
          FROM="${CURRENT_VERSION}"
        fi
        IFS=. read -r MAJOR MINOR PATCH <<< "${FROM}"
        PATCH=$((PATCH + 1))
        while released "${MAJOR}.${MINOR}.${PATCH}"; do
          PATCH=$((PATCH + 1))
        done
        NEW="${MAJOR}.${MINOR}.${PATCH}"

        echo "Bumping to ${NEW}"
        ./mvnw -B -ntp -q versions:set -DnewVersion="${NEW}-SNAPSHOT" -DgenerateBackupPoms=false
        echo "bumped=true" >> "$GITHUB_OUTPUT"
        echo "version=${NEW}" >> "$GITHUB_OUTPUT"
